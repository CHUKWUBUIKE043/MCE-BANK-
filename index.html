<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCE BANK v=102</title>
<style>
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a0a;color:#fff;margin:0;padding:20px}
.container{max-width:420px;margin:0 auto;background:#1a1a1a;border-radius:20px;padding:25px;border:2px solid #00ff88}
h1{color:#00ff88;text-align:center;margin:0 0 20px;font-size:28px}
.balance{font-size:36px;font-weight:bold;text-align:center;color:#00ff88;margin:20px 0}
.card{background:#2a2a2a;padding:15px;border-radius:12px;margin:10px 0;border:1px solid #333}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #444;background:#0a0a0a;color:#fff;font-size:16px;box-sizing:border-box}
button{width:100%;padding:14px;margin:10px 0;border:none;border-radius:12px;background:#00ff88;color:#000;font-weight:bold;font-size:16px;cursor:pointer}
button:active{transform:scale(0.98)}
.login-screen{text-align:center}
.success{color:#00ff88;font-size:14px}
.error{color:#ff4444;font-size:14px}
</style>
</head>
<body>
<div class="container">
<h1>💚 MCE BANK v=102</h1>
<div id="app">Loading...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// YOUR FIREBASE KEYS
const firebaseConfig = {
  apiKey: "AIzaSyDamODVM4Eu4xH2WSGCuhbqTmd73F0bYwE",
  authDomain: "mce-bank.firebaseapp.com",
  projectId: "mce-bank",
  storageBucket: "mce-bank.firebasestorage.app",
  messagingSenderId: "643210223068",
  appId: "1:643210223068:web:645ec21686d0bad4bc0319"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = null;
let unsubscribe = null;

const appDiv = document.getElementById('app');

// SHOW LOGIN
function showLogin() {
  appDiv.innerHTML = `
    <div class="login-screen">
      <h2>Welcome</h2>
      <input id="name" placeholder="Enter Your Name">
      <input id="pin" placeholder="4 Digit PIN" type="password" maxlength="4">
      <button onclick="login()">Login / Create Account</button>
      <p class="success">Now works on ANY device</p>
    </div>
  `;
}

// LOGIN FUNCTION
window.login = async function() {
  const name = document.getElementById('name').value.trim();
  const pin = document.getElementById('pin').value.trim();
  if(!name || pin.length !== 4) return alert('Enter name and 4 digit PIN');
  
  currentUser = name.toLowerCase();
  const userRef = doc(db, "users", currentUser);
  const snap = await getDoc(userRef);
  
  if(!snap.exists()) {
    await setDoc(userRef, {name: name, pin: pin, balance: 10000});
  } else {
    if(snap.data().pin !== pin) return alert('Wrong PIN');
  }
  
  showDashboard();
}

// SHOW DASHBOARD
function showDashboard() {
  const userRef = doc(db, "users", currentUser);
  if(unsubscribe) unsubscribe();
  
  unsubscribe = onSnapshot(userRef, (snap) => {
    const data = snap.data();
    appDiv.innerHTML = `
      <div class="card">
        <p>Welcome, ${data.name}</p>
        <div class="balance">₦${data.balance.toLocaleString()}</div>
      </div>
      <div class="card">
        <h3>Send Money</h3>
        <input id="to" placeholder="Receiver Name">
        <input id="amount" placeholder="Amount" type="number">
        <button onclick="sendMoney()">Send</button>
        <p id="msg"></p>
      </div>
      <button onclick="logout()" style="background:#444;color:#fff">Logout</button>
    `;
  });
}

// SEND MONEY
window.sendMoney = async function() {
  const to = document.getElementById('to').value.trim().toLowerCase();
  const amount = parseInt(document.getElementById('amount').value);
  const msg = document.getElementById('msg');
  
  if(!to || !amount || amount < 100) return msg.innerHTML = '<span class="error">Min ₦100</span>';
  
  const fromRef = doc(db, "users", currentUser);
  const toRef = doc(db, "users", to);
  
  const fromSnap = await getDoc(fromRef);
  const toSnap = await getDoc(toRef);
  
  if(!toSnap.exists()) return msg.innerHTML = '<span class="error">User not found</span>';
  if(fromSnap.data().balance < amount) return msg.innerHTML = '<span class="error">Insufficient balance</span>';
  
  await updateDoc(fromRef, {balance: fromSnap.data().balance - amount});
  await updateDoc(toRef, {balance: toSnap.data().balance + amount});
  
  msg.innerHTML = '<span class="success">₦'+amount+' sent to '+to+'</span>';
  document.getElementById('amount').value = '';
  document.getElementById('to').value = '';
}

// LOGOUT
window.logout = function() {
  currentUser = null;
  if(unsubscribe) unsubscribe();
  showLogin();
}

showLogin();
</script>
</body>
</html>
