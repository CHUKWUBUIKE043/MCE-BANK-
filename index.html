<!DOCTYPE html>
<html>
<head>
  <title>MCE BANK 👑</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; background: #f5f5f5; margin: 0; padding: 0; }
    .container { max-width: 500px; margin: auto; background: white; min-height: 100vh; padding-bottom: 40px; }
    input, button, select, textarea { padding: 12px; margin: 8px 0; width: 90%; border-radius: 10px; border: 1px solid #ddd; font-size: 14px; display: block; }
    button { background: #ff9900; color: white; border: none; cursor: pointer; font-weight: bold; }
    .btn-blue { background: #0033cc; color: white; }
    .btn-green { background: #28a745; color: white; }
    .page { display: none; padding: 20px; }
    .active { display: block; }
    .card { background: white; border-radius: 15px; padding: 20px; margin: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center; }
    .action-btn { background: #fff; border: 1px solid #eee; padding: 15px 5px; border-radius: 12px; cursor: pointer; font-size: 12px; }
    .action-btn span { font-size: 24px; display: block; margin-bottom: 5px; }
    .hide-balance { cursor: pointer; color: #0066ff; }
    .transaction { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
    .green { color: #28a745; font-weight: bold; }
    .red { color: #dc3545; font-weight: bold; }
    .error { color: red; font-size: 12px; margin-top: -5px; }
  </style>
</head>
<body>
<div class="container">

<div id="home" class="page active">
  <h1 style="text-align:center;">Welcome to MCE BANK 👑</h1>
  <button onclick="showPage('signup')">Sign Up</button>
  <button onclick="showPage('login')">Sign In</button>
</div>

<div id="signup" class="page"><h2>Create Account</h2><p id="signup_error" class="error"></p><input type="text" id="s_name" placeholder="Full Name"><input type="email" id="s_email" placeholder="Email"><input type="text" id="s_phone" placeholder="Phone Number"><select id="s_financial"><option value="">Financial Situation</option><option>Student</option><option>Employed</option></select><input type="password" id="s_password" placeholder="Password"><button onclick="signup()">Create Account</button><p><a href="#" onclick="showPage('home')">Back</a></p></div>

<div id="login" class="page"><h2>Sign In</h2><p id="login_error" class="error"></p><input type="email" id="l_email" placeholder="Email"><input type="password" id="l_password" placeholder="Password"><button onclick="login()">Sign In</button><p><a href="#" onclick="showPage('home')">Back</a></p></div>

<div id="dashboard" class="page">
  <div style="display:flex; align-items:center; padding:15px;"><img src="https://i.imgur.com/8Km9tLL.png" style="width:45px; height:45px; border-radius:50%; margin-right:10px;"><div><b>Welcome back</b><br><span id="d_name"></span></div></div>
  <div class="card"><p style="color:gray;">AVAILABLE BALANCE <span class="hide-balance" onclick="toggleBalance()">👁️</span></p><h2 id="balance_text">$0.00</h2><hr><p style="display:flex; justify-content:space-between;"><span><b>ACCOUNT NUMBER</b><br><span id="d_acc"></span></span><span style="color:gray;"><b>STATUS</b><br>ACTIVE</span></p></div>
  <div class="card"><div class="grid-4"><div class="action-btn" onclick="showPage('transfer')"><span>↔️</span>Transfer</div><div class="action-btn" onclick="showPage('deposit')"><span>⬇️</span>Deposit</div><div class="action-btn" onclick="showPage('pay')"><span>✈️</span>Pay</div><div class="action-btn" onclick="showPage('message')"><span>💬</span>Message</div></div></div>
  <div class="card"><h3>Recent Transactions</h3><div id="transactions_list"></div></div>
  <button onclick="logout()">Logout</button>
</div>

<div id="deposit" class="page"><h2>Deposit Money</h2><input type="number" id="add_amount" placeholder="Enter Amount"><button class="btn-green" onclick="addMoney()">Add Money</button><p><a href="#" onclick="showPage('dashboard')">Back</a></p></div>
<div id="transfer" class="page"><h2>Transfer Funds</h2><label>ACCOUNT NUMBER</label><input type="text" id="t_acc" placeholder="Enter Account Number"><label>RECIPIENT NAME</label><input type="text" id="t_name" placeholder="Full Name"><label>AMOUNT</label><input type="number" id="t_amount" placeholder="0.00"><button class="btn-blue" onclick="doTransfer()">Send Money</button><p><a href="#" onclick="showPage('dashboard')">Back</a></p></div>
<div id="pay" class="page"><h2>Pay Bills</h2><input type="text" id="p_biller" placeholder="Biller Name"><input type="number" id="p_amount" placeholder="Amount"><button onclick="doPay()">Pay Now</button><p><a href="#" onclick="showPage('dashboard')">Back</a></p></div>
<div id="message" class="page"><h2>Message Support</h2><textarea id="msg_text" placeholder="Type your message here..." rows="4"></textarea><button onclick="sendMessage()">Send Message</button><p><a href="#" onclick="showPage('dashboard')">Back</a></p></div>

</div>
<script>
let showBal = true;
let currentUser = null;

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  document.getElementById('signup_error').innerText = '';
  document.getElementById('login_error').innerText = '';
  if(pageId === 'dashboard') { loadDashboard(); }
}

// NEW: Save all users in a list
function getAllUsers() { return JSON.parse(localStorage.getItem('mcebank_all_users')) || []; }
function saveAllUsers(users) { localStorage.setItem('mcebank_all_users', JSON.stringify(users)); }
function getCurrentUser() { return JSON.parse(localStorage.getItem('mcebank_current_user')); }
function saveCurrentUser(user) { localStorage.setItem('mcebank_current_user', JSON.stringify(user)); }

function signup() {
  document.getElementById('signup_error').innerText = '';
  const email = document.getElementById('s_email').value;
  let allUsers = getAllUsers();
  
  // CHECK IF EMAIL ALREADY EXISTS
  const existing = allUsers.find(u => u.email === email);
  if(existing) {
    document.getElementById('signup_error').innerText = 'This email already has an account. Please Login.';
    return;
  }

  const user = { 
    name: document.getElementById('s_name').value, 
    email: email, 
    phone: document.getElementById('s_phone').value, 
    financial: document.getElementById('s_financial').value, 
    password: document.getElementById('s_password').value, 
    accNumber: 'MCE' + Math.floor(Math.random()*9000000 + 1000000), 
    balance: 0.00, 
    transactions: [] 
  };
  
  allUsers.push(user);
  saveAllUsers(allUsers);
  saveCurrentUser(user); 
  loadDashboard();
}

function login() {
  document.getElementById('login_error').innerText = '';
  const email = document.getElementById('l_email').value; 
  const password = document.getElementById('l_password').value;
  let allUsers = getAllUsers();
  
  // CHECK ALL USERS FOR MATCH
  const user = allUsers.find(u => u.email === email && u.password === password);
  if(user) { 
    saveCurrentUser(user); 
    loadDashboard(); 
  } else { 
    document.getElementById('login_error').innerText = "Wrong email or password"; 
  }
}

function loadDashboard() {
  currentUser = getCurrentUser();
  if(!currentUser) { showPage('home'); return; }
  document.getElementById('d_name').innerText = currentUser.name.split(' ')[0];
  document.getElementById('d_acc').innerText = currentUser.accNumber;
  updateBalanceDisplay(currentUser.balance);
  loadTransactions(currentUser.transactions);
}

function updateUserInList(updatedUser) {
  let allUsers = getAllUsers();
  let index = allUsers.findIndex(u => u.accNumber === updatedUser.accNumber);
  if(index !== -1) {
    allUsers[index] = updatedUser;
    saveAllUsers(allUsers);
  }
  saveCurrentUser(updatedUser);
}

function toggleBalance() { showBal =!showBal; updateBalanceDisplay(currentUser.balance); }
function updateBalanceDisplay(balance) { document.getElementById('balance_text').innerText = showBal? `$${balance.toFixed(2)}` : '••••'; }

function addMoney() {
  const amount = parseFloat(document.getElementById('add_amount').value);
  if(isNaN(amount) || amount <= 0) { alert("Enter valid amount"); return; }
  currentUser.balance += amount;
  currentUser.transactions.unshift({type: 'Deposit', amount: amount, date: new Date().toLocaleString()});
  updateUserInList(currentUser);
  updateBalanceDisplay(currentUser.balance);
  document.getElementById('add_amount').value = '';
  alert(`$${amount.toFixed(2)} Deposited!`);
  showPage('dashboard');
}

function doTransfer() {
  const amount = parseFloat(document.getElementById('t_amount').value);
  if(isNaN(amount) || amount <= 0) { alert("Enter valid amount"); return; }
  if(currentUser.balance < amount) { alert("Insufficient Balance"); return; }
  currentUser.balance -= amount;
  currentUser.transactions.unshift({type: `Transfer to ${document.getElementById('t_name').value}`, amount: amount, date: new Date().toLocaleString()});
  updateUserInList(currentUser);
  updateBalanceDisplay(currentUser.balance);
  alert(`$${amount.toFixed(2)} Sent`);
  showPage('dashboard');
}

function doPay() { alert("Paid"); showPage('dashboard'); }
function sendMessage() { alert("Message Sent"); showPage('dashboard'); }

function loadTransactions(transactions) {
  const list = document.getElementById('transactions_list');
  if(!transactions || transactions.length === 0) {
    list.innerHTML = '<p style="color:gray;">No transactions yet</p>';
    return;
  }
  list.innerHTML = transactions.slice(0,5).map(t => `
    <div class="transaction">
      <div><b>${t.type}</b><br><span style="color:gray; font-size:12px;">${t.date}</span></div>
      <div class="${t.type.includes('Deposit')? 'green' : 'red'}">${t.type.includes('Deposit')? '+' : '-'}$${t.amount.toFixed(2)}</div>
    </div>
  `).join('');
}

function logout() { localStorage.removeItem('mcebank_current_user'); currentUser = null; showPage('home'); }

window.onload = function() { 
  const user = getCurrentUser(); 
  if(user) { loadDashboard(); } 
}
</script>
</body>
                                                                                                                                                     </html>
