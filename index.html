<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCE BANK v=113</title>
<style>
  body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; padding:20px; }
 .container { max-width:400px; margin:auto; background:#fff; padding:20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
  input, button { width:100%; padding:12px; margin:8px 0; border-radius:6px; border:1px solid #ccc; font-size:16px; }
  button { background:#00a859; color:#fff; border:none; cursor:pointer; }
  button:disabled { background:#ccc; }
 .hidden { display:none; }
 .error { color:red; font-size:14px; }
 .success { color:green; font-size:14px; }
 .tx-item { border-bottom:1px solid #eee; padding:8px 0; }
  /* Receipt Popup */
 .receipt { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; }
 .receipt-box { background:#fff; padding:20px; border-radius:10px; width:90%; max-width:350px; text-align:center; }
 .receipt-header { background:#00a859; color:#fff; padding:15px; border-radius:8px 8px 0 0; font-weight:bold; }
</style>
</head>
<body>
<div class="container" id="authScreen">
  <h2>MCE BANK Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>
  <p class="error" id="authError"></p>
</div>

<div class="container hidden" id="appScreen">
  <h2>Welcome <span id="userName"></span></h2>
  <p>Account: <span id="accNumber"></span></p>
  <p>Balance: ₦<span id="balance">0.00</span></p>

  <h3>Transfer</h3>
  <input type="text" id="toAccount" placeholder="Recipient Account Number" oninput="checkAccount()">
  <p id="accStatus" class="error"></p>
  <input type="number" id="amount" placeholder="Amount">
  <input type="password" id="pin" placeholder="4 Digit PIN" maxlength="4">
  <button onclick="sendMoney()">Send</button>

  <h3>Recent Transactions</h3>
  <div id="txList"></div>
  <button onclick="logout()">Logout</button>
</div>

<!-- Receipt Popup -->
<div class="receipt hidden" id="receiptPopup">
  <div class="receipt-box">
    <div class="receipt-header">Transaction Successful</div>
    <p><b>Date:</b> <span id="rDate"></span></p>
    <p><b>Amount:</b> ₦<span id="rAmount"></span></p>
    <p><b>From:</b> <span id="rFrom"></span></p>
    <p><b>To:</b> <span id="rTo"></span></p>
    <p><b>Reference:</b> <span id="rRef"></span></p>
    <p><b>Status:</b> Success</p>
    <button onclick="closeReceipt()">Close</button>
  </div>
</div>

<script type="module">
  // 1. FIREBASE INIT
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, where, getDocs, addDoc, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDamODVM4Eu4xH2WSGCuhbqTmd73F0bYwE",
    authDomain: "mce-bank.firebaseapp.com",
    projectId: "mce-bank",
    storageBucket: "mce-bank.firebasestorage.app",
    messagingSenderId: "643210223068",
    appId: "1:643210223068:web:645ec21686d0bad4bc0319"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;

  // 2. AUTH
  window.signup = async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const accNumber = Math.floor(1000000 + Math.random() * 9000000000).toString(); // 10 digit
    try {
      const userCred = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, "users", userCred.user.uid), {
        email, accNumber, balance: 5000, pin: "1234", name: email.split('@')[0] // default balance 5000 for testing
      });
      alert("Account created. Acc No: " + accNumber);
    } catch(e) { document.getElementById('authError').innerText = e.message; }
  }

  window.login = async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch(e) { document.getElementById('authError').innerText = e.message; }
  }

  window.logout = () => signOut(auth);

  onAuthStateChanged(auth, async (user) => {
    if(user) {
      currentUser = user;
      const userDoc = await getDoc(doc(db, "users", user.uid));
      const data = userDoc.data();
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');
      document.getElementById('userName').innerText = data.name;
      document.getElementById('accNumber').innerText = data.accNumber;
      document.getElementById('balance').innerText = data.balance.toFixed(2);

      // Live balance + Live transactions
      onSnapshot(doc(db, "users", user.uid), (snap) => {
        document.getElementById('balance').innerText = snap.data().balance.toFixed(2);
      });

      const q = query(collection(db, "transactions"), where("participants", "array-contains", user.uid), orderBy("date", "desc"));
      onSnapshot(q, (snap) => {
        document.getElementById('txList').innerHTML = "";
        snap.forEach(d => {
          const tx = d.data();
          document.getElementById('txList').innerHTML += `<div class="tx-item">${tx.type} ₦${tx.amount} - ${tx.date}</div>`;
        });
      });

    } else {
      document.getElementById('authScreen').classList.remove('hidden');
      document.getElementById('appScreen').classList.add('hidden');
    }
  });

  // 3. BUG #9: CHECK ACCOUNT + RECEIPT
  window.checkAccount = async () => {
    const acc = document.getElementById('toAccount').value;
    const status = document.getElementById('accStatus');
    if(acc.length!== 10) { status.innerText = ""; return; }
    const q = query(collection(db, "users"), where("accNumber", "==", acc));
    const snap = await getDocs(q);
    if(snap.empty) { status.innerText = "Account not found"; status.className="error"; }
    else { status.innerText = "Recipient: " + snap.docs[0].data().name; status.className="success"; }
  }

  window.sendMoney = async () => {
    const toAcc = document.getElementById('toAccount').value;
    const amount = parseFloat(document.getElementById('amount').value);
    const pin = document.getElementById('pin').value;
    const userDoc = await getDoc(doc(db, "users", currentUser.uid));
    if(userDoc.data().pin!== pin) return alert("Wrong PIN");
    if(userDoc.data().balance < amount) return alert("Insufficient balance");

    const q = query(collection(db, "users"), where("accNumber", "==", toAcc));
    const snap = await getDocs(q);
    if(snap.empty) return alert("Account not found");
    const receiver = snap.docs[0];

    // Update both balances
    await updateDoc(doc(db, "users", currentUser.uid), { balance: userDoc.data().balance - amount });
    await updateDoc(doc(db, "users", receiver.id), { balance: receiver.data().balance + amount });

    // Save transaction for both
    const ref = "MCE" + Date.now();
    const date = new Date().toLocaleString();
    await addDoc(collection(db, "transactions"), {
      from: currentUser.uid, to: receiver.id, amount, date, ref, type: "Transfer", participants: [currentUser.uid, receiver.id]
    });

    // Show Receipt
    document.getElementById('rDate').innerText = date;
    document.getElementById('rAmount').innerText = amount;
    document.getElementById('rFrom').innerText = userDoc.data().accNumber;
    document.getElementById('rTo').innerText = toAcc;
    document.getElementById('rRef').innerText = ref;
    document.getElementById('receiptPopup').classList.remove('hidden');
  }

  window.closeReceipt = () => document.getElementById('receiptPopup').classList.add('hidden');

</script>
</body>
</html>
