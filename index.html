<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCE BANK</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
  body { background: #000; font-family: system-ui; }
.gradient-btn { background: linear-gradient(90deg, #8B5CF6 0%, #10B981 100%); }
.nav-active { color: #10B981; }
.card-blue { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); }
.notif-dot { background: red; width: 8px; height: 8px; border-radius: 50%; position: absolute; top: 0; right: 0; }
</style>
</head>
<body class="text-white">

<!-- LOGIN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-[#111] rounded-2xl p-6">
    <h1 class="text-3xl font-bold text-center mb-8">MCE BANK</h1>
    <input id="email" type="text" placeholder="Email or Phone" class="w-full bg-[#222] rounded-lg p-3 mb-4 outline-none">
    <input id="password" type="password" placeholder="Password" class="w-full bg-[#222] rounded-lg p-3 mb-6 outline-none">
    <button onclick="login()" class="w-full gradient-btn font-bold py-3 rounded-lg mb-3">Login</button>
    <button onclick="signup()" class="w-full bg-[#222] font-bold py-3 rounded-lg">Create Account</button>
    <p id="loginMsg" class="text-center text-red-400 mt-3"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden min-h-screen flex-col">
  <!-- HEADER -->
  <div class="flex justify-between items-center p-4">
    <div>
      <h2 class="text-xl font-bold">Hi, <span id="userName"></span> 👋</h2>
      <p class="text-sm text-gray-400">Acct: <span id="accountNumber"></span></p>
    </div>
    <div class="relative" onclick="showPage('notifPage')">
      <div class="text-2xl">🔔</div>
      <div id="notifDot" class="notif-dot hidden"></div>
    </div>
  </div>

  <!-- HOME -->
  <div id="homePage" class="flex-1 px-4 pb-24">
    <div class="bg-[#111] rounded-2xl p-4">
      <p class="text-gray-400">Available Balance</p>
      <p class="text-3xl font-bold">₦<span id="balance">0</span></p>
    </div>
    <div class="bg-[#111] rounded-2xl p-4 mt-4">
      <h3 class="font-bold mb-2">Send Money</h3>
      <input id="receiverAcc" oninput="lookupName()" placeholder="Enter 10 digit Account Number" maxlength="10" class="w-full bg-[#222] rounded p-2 mb-2">
      <p id="receiverName" class="text-green-400 text-sm mb-2 h-5"></p>
      <input id="amount" type="number" placeholder="Amount" class="w-full bg-[#222] rounded p-2 mb-2">
      <button onclick="sendMoney()" class="w-full gradient-btn font-bold py-2 rounded">Send</button>
    </div>
    <div class="bg-[#111] rounded-2xl p-4 mt-4">
      <h3 class="font-bold">Recent Transactions</h3>
      <div id="txList" class="text-sm text-gray-400 mt-2">No transactions yet</div>
    </div>
  </div>

  <!-- OTHER PAGES -->
  <div id="rewardsPage" class="hidden flex-1 p-4 pb-24"><h2 class="text-2xl font-bold">Rewards</h2></div>
  <div id="financePage" class="hidden flex-1 p-4 pb-24"><h2 class="text-2xl font-bold">Finance</h2></div>
  <div id="cardsPage" class="hidden flex-1 p-4 pb-24">
    <h2 class="text-2xl font-bold">Cards</h2>
    <div class="card-blue rounded-2xl p-4 mt-4">
      <p>MCE BANK • VISA</p>
      <p class="text-2xl tracking-widest mt-4" id="cardNumber">****</p>
      <p class="mt-2">CARDHOLDER: <span id="cardName"></span></p>
    </div>
  </div>
  <div id="notifPage" class="hidden flex-1 p-4 pb-24"><h2 class="text-2xl font-bold">Notifications</h2><div id="notifList"></div></div>

  <!-- RECEIPT -->
  <div id="receiptPage" class="hidden flex-1 p-4 text-center">
    <div class="text-green-500 text-6xl mb-4">✓</div>
    <h2 class="text-green-500 text-2xl font-bold">Transfer Successful</h2>
    <p class="text-4xl font-bold mt-4" id="receiptAmount">₦0</p>
    <div class="bg-[#111] rounded-2xl p-4 mt-4 text-left">
      <p>To: <span id="receiptTo"></span></p>
      <p>Acct: <span id="receiptAcc"></span></p>
      <p>Date: <span id="receiptDate"></span></p>
    </div>
    <button onclick="goHome()" class="w-full gradient-btn font-bold py-3 rounded-lg mt-4">Done</button>
  </div>

  <!-- BOTTOM NAV -->
  <div class="fixed bottom-0 left-0 right-0 bg-[#111] flex justify-around py-2">
    <div onclick="showPage('homePage')" class="text-center nav-active"><div>🏠</div><div class="text-xs">Home</div></div>
    <div onclick="showPage('rewardsPage')" class="text-center text-gray-500"><div>💎</div><div class="text-xs">Rewards</div></div>
    <div onclick="showPage('financePage')" class="text-center text-gray-500"><div>📊</div><div class="text-xs">Finance</div></div>
    <div onclick="showPage('cardsPage')" class="text-center text-gray-500"><div>💳</div><div class="text-xs">Cards</div></div>
    <div onclick="showPage('homePage')" class="text-center text-gray-500"><div>👤</div><div class="text-xs">Me</div></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB9V8N7M6L5K4J3H2G1F0E9D8C7B6A5Z4",
    authDomain: "mce-bank.firebaseapp.com",
    projectId: "mce-bank",
    storageBucket: "mce-bank.appspot.com",
    messagingSenderId: "123456789012",
    appId: "1:123456789012:web:abcdef1234567890"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  let currentUser = null;
  let foundReceiver = null;

  function generateAccount() {
    return '01' + Math.floor(Math.random()*100000000).toString().padStart(8,'0');
  }
  function generateCardNumber() {
    return '4' + Math.floor(Math.random()*1000000000000).toString().padStart(15,'0');
  }

  async function signup() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    if(!email ||!password) return alert('Fill all fields');

    const doc = await db.collection('users').doc(email).get();
    if(doc.exists) {
      document.getElementById('loginMsg').innerText = 'Email/Phone already exists';
      return;
    }

    const acc = generateAccount();
    await db.collection('users').doc(email).set({
      email, password, balance: 10000, name: email.split('@')[0],
      accountNumber: acc, cardNumber: generateCardNumber(), transactions: [], notifications: []
    });
    login();
  }

  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const doc = await db.collection('users').doc(email).get();
    if(!doc.exists || doc.data().password!== password) {
      document.getElementById('loginMsg').innerText = 'Wrong Email or Password';
      return;
    }
    currentUser = doc.data();
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('userName').innerText = currentUser.name;
    document.getElementById('accountNumber').innerText = currentUser.accountNumber;
    document.getElementById('balance').innerText = currentUser.balance;
    document.getElementById('cardNumber').innerText = currentUser.cardNumber;
    document.getElementById('cardName').innerText = currentUser.name.toUpperCase();

    db.collection('users').doc(email).onSnapshot(snap => {
      const data = snap.data();
      document.getElementById('balance').innerText = data.balance;
      loadTransactions(data.transactions);
      loadNotifications(data.notifications);
    });
  }

  async function lookupName() {
    const acc = document.getElementById('receiverAcc').value;
    if(acc.length!== 10) { document.getElementById('receiverName').innerText = ''; foundReceiver = null; return; }

    const snapshot = await db.collection('users').where('accountNumber','==',acc).get();
    if(!snapshot.empty) {
      foundReceiver = snapshot.docs[0].data();
      document.getElementById('receiverName').innerText = 'To: ' + foundReceiver.name;
    } else {
      document.getElementById('receiverName').innerText = 'Account not found';
      foundReceiver = null;
    }
  }

  async function sendMoney() {
    const amount = parseInt(document.getElementById('amount').value);
    if(!foundReceiver) return alert('Enter valid account number');
    if(amount > currentUser.balance) return alert('Insufficient funds');

    const tx = {type: 'Sent', to: foundReceiver.name, toAcc: foundReceiver.accountNumber, amount, date: new Date().toLocaleString()};
    const rTx = {type: 'Received', from: currentUser.name, fromAcc: currentUser.accountNumber, amount, date: new Date().toLocaleString()};

    await db.collection('users').doc(currentUser.email).update({
      balance: currentUser.balance - amount,
      transactions: firebase.firestore.FieldValue.arrayUnion(tx)
    });
    await db.collection('users').doc(foundReceiver.email).update({
      balance: foundReceiver.balance + amount,
      transactions: firebase.firestore.FieldValue.arrayUnion(rTx),
      notifications: firebase.firestore.FieldValue.arrayUnion(`You received ₦${amount} from ${currentUser.name}`)
    });

    document.getElementById('homePage').classList.add('hidden');
    document.getElementById('receiptPage').classList.remove('hidden');
    document.getElementById('receiptAmount').innerText = '₦' + amount.toLocaleString() + '.00';
    document.getElementById('receiptTo').innerText = foundReceiver.name;
    document.getElementById('receiptAcc').innerText = foundReceiver.accountNumber;
    document.getElementById('receiptDate').innerText = new Date().toLocaleDateString();
  }

  function loadTransactions(tx) {
    if(tx.length === 0) return;
    document.getElementById('txList').innerHTML = tx.slice(-5).reverse().map(t =>
      `<p class="text-sm mb-1">${t.type} ${t.type==='Sent'?'to':'from'} ${t.to||t.from} ₦${t.amount}</p>`
    ).join('');
  }
  function loadNotifications(n) {
    document.getElementById('notifDot').classList.toggle('hidden', n.length === 0);
    document.getElementById('notifList').innerHTML = n.length===0? '<p class="text-gray-400">No notifications</p>' : n.reverse().map(x => `<p class="bg-[#111] p-3 rounded mb-2">${x}</p>`).join('');
  }
  function showPage(id) {
    document.querySelectorAll('#app > div[id$="Page"]').forEach(p => p.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }
  function goHome() { showPage('homePage'); }
</script>
</body>
</html>
