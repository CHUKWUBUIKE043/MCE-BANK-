<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCE BANK</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:20px}
input,button{width:80%;padding:12px;margin:8px;border-radius:8px;border:none}
button{background:#4a00e0;color:#fff;font-weight:bold;cursor:pointer}
.card{background:#111;padding:15px;margin:10px;border-radius:10px}
#me,#dashboard,#signup,#forgot{display:none}
.bell{position:fixed;top:20px;right:20px;font-size:24px}
.dot{background:red;border-radius:50%;width:10px;height:10px;position:absolute;top:0;right:0}
</style>
</head>
<body>
<h1>MCE BANK</h1>

<div id="login">
<input id="lemail" type="email" placeholder="Email">
<input id="lpass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="show('signup')">Sign Up</button>
<button onclick="show('forgot')">Forgot Password?</button>
</div>

<div id="signup">
<input id="sname" placeholder="Full Name">
<input id="semail" type="email" placeholder="Email">
<input id="spass" type="password" placeholder="Password">
<input id="scpass" type="password" placeholder="Confirm Password">
<input id="spin" type="password" placeholder="Transfer PIN 4 digits">
<button onclick="signup()">Create Account</button>
<button onclick="show('login')">Back to Login</button>
</div>

<div id="forgot">
<input id="femail" type="email" placeholder="Enter your email">
<button onclick="resetPass()">Send Reset Link</button>
<button onclick="show('login')">Back to Login</button>
</div>

<div id="dashboard">
<div class="bell" onclick="showNoti()">🔔<span id="dot" class="dot" style="display:none"></span></div>
<h2>Dashboard</h2>
<div class="card">Balance: <span id="bal">$0</span></div>
<button onclick="show('me')">Me</button>
<button onclick="logout()">Logout</button>
</div>

<div id="me">
<h2>Me</h2>
<div class="card">Transaction History: <div id="hist">No transactions yet</div></div>
<div class="card">Account Limits: <span id="limits">$50,000 / $200,000</span></div>
<div class="card">Bank Card: <span id="cardname">NAME</span></div>
<button onclick="show('dashboard')">Back</button>
</div>

<script>
let currentUser = null;
let users = JSON.parse(localStorage.getItem('mce_users')||'{}');

function show(id){
['login','signup','forgot','dashboard','me'].forEach(x=>document.getElementById(x).style.display='none');
document.getElementById(id).style.display='block';
}

function signup(){
let name=sname.value.trim(), email=semail.value.trim().toLowerCase(), pass=spass.value, cpass=scpass.value, pin=spin.value;
if(!name||!email||!pass||!cpass||!pin){alert('Fill all fields');return;}
if(pass!==cpass){alert('Passwords do not match');return;}
if(users[email]){alert('Account already exists');return;}
users[email]={name,pass,pin,bal:1000,hist:[],noti:[]};
localStorage.setItem('mce_users',JSON.stringify(users));
alert('Account created!');
show('login');
}

function login(){ // FIXED THIS PART ONLY
let email=lemail.value.trim().toLowerCase(), pass=lpass.value;
if(!users[email]){alert('Invalid email or password');return;}
if(users[email].pass!==pass){alert('Invalid email or password');return;}
currentUser=email;
bal.innerText='$'+users[email].bal;
cardname.innerText=users[email].name.toUpperCase();
hist.innerHTML=users[email].hist.length?users[email].hist.join('<br>'):'No transactions yet';
limits.innerText='$50,000 / $200,000';
if(users[email].noti.length>0) dot.style.display='block';
show('dashboard');
}

function resetPass(){
let email=femail.value.trim().toLowerCase();
if(!users[email]){alert('Email not found');return;}
let newpass=prompt('Enter new password');
if(newpass){users[email].pass=newpass;localStorage.setItem('mce_users',JSON.stringify(users));alert('Password reset!');show('login');}
}

function logout(){currentUser=null;show('login');}

function showNoti(){
if(!currentUser)return;
alert(users[currentUser].noti.join('\n')||'No notifications');
users[currentUser].noti=[];
localStorage.setItem('mce_users',JSON.stringify(users));
dot.style.display='none';
}

show('login');
</script>
</body>
</html>
