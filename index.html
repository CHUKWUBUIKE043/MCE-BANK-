<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCE BANK - v85</title>
<style>
:root{--purple:#7c3aed;--green:#22c55e;--black:#0a0a0a;--dark:#151515}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,sans-serif}
body{background:var(--black);color:#fff;padding-bottom:90px}
.page{display:none}.page.active{display:block}
.header{padding:20px;font-size:24px;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.notif-icon{position:relative;cursor:pointer}
.notif-badge{position:absolute;background:red;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;top:-5px;right:-8px}
.balance-card{background:linear-gradient(135deg,#4f46e5 0%,#06b6d4 50%,#22c55e 100%);margin:0 16px;padding:24px;border-radius:20px}
.balance{font-size:36px;font-weight:900;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 16px;text-align:center}
.btn-grid{background:var(--dark);padding:18px 10px;border-radius:16px;cursor:pointer}
.btn-icon{font-size:32px;margin-bottom:8px}
.grid8{display:grid;grid-template-columns:repeat(4,1fr);gap:25px;margin:20px 16px;text-align:center}
.section{background:var(--dark);margin:12px 16px;padding:16px;border-radius:14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.txn-item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #222}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,var(--purple) 0%,var(--green) 100%);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer}
.input{width:100%;padding:14px;background:#222;border:1px solid #333;border-radius:10px;color:#fff;margin:10px 0}
.bottom-nav{position:fixed;bottom:0;width:100%;background:#0f0f0f;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0 20px 0}
.nav-item{text-align:center;color:#888;font-size:11px;cursor:pointer;flex:1}
.nav-item.active{color:var(--green)}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);justify-content:center;align-items:center;z-index:99}
.modal-content{background:var(--dark);padding:24px;border-radius:20px;width:90%;max-width:400px;max-height:80vh;overflow-y:auto}
</style>
</head>
<body>

<!-- HOME -->
<div id="homePage" class="page active">
  <div class="header">
    <div>Hi, <span id="userName">USER</span></div>
    <div class="notif-icon" onclick="openNotifications()">🔔<span class="notif-badge" id="notifCount" style="display:none">0</span></div>
  </div>
  
  <div class="balance-card">
    <div style="display:flex;justify-content:space-between"><div>Available Balance 🛡️</div><div onclick="toggleBalance()" id="eye">👁️</div></div>
    <div class="balance" id="balance">$0.00</div>
    <div style="font-size:12px;opacity:0.8" id="accNo"></div>
  </div>
  
  <div class="grid3">
    <div class="btn-grid" onclick="openDeposit()"><div class="btn-icon">⬇️</div><div>Add<br>Money</div></div>
    <div class="btn-grid" onclick="openTransfer()"><div class="btn-icon">💸</div><div>Transfer</div></div>
    <div class="btn-grid" onclick="openWithdraw()"><div class="btn-icon">⬆️</div><div>Withdraw</div></div>
  </div>

  <div class="section"><div><b>📄 Recent Transaction</b></div></div>
  <div id="recentTxn" style="padding:0 16px">
    <p style="text-align:center;color:#888;padding:20px">No transactions yet</p>
  </div>

  <div class="grid8">
    <div class="btn-grid" onclick="openAirtime()"><div class="btn-icon" style="color:orange">📶</div><div>Airtime</div></div>
    <div class="btn-grid" onclick="openData()"><div class="btn-icon">📱</div><div>Data</div></div>
    <div class="btn-grid" onclick="openBills()"><div class="btn-icon" style="color:yellow">💡</div><div>Bills</div></div>
    <div class="btn-grid" onclick="openTV()"><div class="btn-icon">📺</div><div>TV</div></div>
    <div class="btn-grid" onclick="openSafeBox()"><div class="btn-icon" style="color:orange">🔒</div><div>SafeBox</div></div>
    <div class="btn-grid" onclick="openLoan()"><div class="btn-icon" style="color:var(--green)">$</div><div>Loan</div></div>
    <div class="btn-grid" onclick="openGame()"><div class="btn-icon">🎮</div><div>Game</div></div>
    <div class="btn-grid" onclick="openMore()"><div class="btn-icon">⋯</div><div>More</div></div>
  </div>
</div>

<!-- NOTIFICATIONS PAGE -->
<div id="notifPage" class="page">
  <div class="header"><div onclick="switchPage('homePage')">←</div><div>Notifications</div><div></div></div>
  <div id="notifList" style="padding:0 16px"></div>
</div>

<!-- ME -->
<div id="settingsPage" class="page">
  <div class="header">👤 Me</div>
  <div class="section"><div>📧</div><div><b>Email</b><br><span id="setEmail"></span></div></div>
  <div class="section"><div>📱</div><div><b>Phone</b><br><span id="setPhone"></span></div></div>
  <div class="section"><div>🏦</div><div><b>Account</b><br><span id="setAcc"></span></div></div>
  <div class="section" onclick="openCurrency()"><div>💱</div><div><b>Currency & Country</b><br><span id="setCurrency">USA $</span></div><div style="margin-left:auto">></div></div>
  <button class="btn" style="background:red;margin:20px 16px" onclick="logout()">Sign Out</button>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchPage('homePage',this)"><div class="nav-icon">🏠</div>Home</div>
  <div class="nav-item" onclick="alert('Rewards')"><div class="nav-icon">💎</div>Rewards</div>
  <div class="nav-item" onclick="alert('Finance')"><div class="nav-icon">📊</div>Finance</div>
  <div class="nav-item" onclick="alert('Cards')"><div class="nav-icon">💳</div>Cards</div>
  <div class="nav-item" onclick="switchPage('settingsPage',this)"><div class="nav-icon">👤</div>Me</div>
</div>

<div class="modal" id="modal"><div class="modal-content"><span style="float:right;font-size:26px;cursor:pointer" onclick="closeModal()">&times;</span><div id="modalBody"></div></div></div>

<script>
let users = JSON.parse(localStorage.getItem('mceUsers') || '[]');
let currentUser = JSON.parse(localStorage.getItem('mceCurrent') || 'null');
let showBalance = true;

const countries = [
  {name:'USA',currency:'$'},
  {name:'Nigeria',currency:'₦'},
  {name:'UK',currency:'£'},
  {name:'Europe',currency:'€'},
  {name:'Ghana',currency:'GH₵'},
  {name:'Canada',currency:'C$'}
];

function switchPage(pageId, el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  if(pageId==='notifPage') loadNotifications();
}
function closeModal(){modal.style.display='none'}
function formatBalance(num){return currentUser.currency + num.toLocaleString('en-US',{minimumFractionDigits:2})}
function toggleBalance(){showBalance=!showBalance;eye.innerText=showBalance?'👁️':'🙈';balance.innerText=showBalance?formatBalance(currentUser.balance):'****'}
function save(){localStorage.setItem('mceUsers',JSON.stringify(users));localStorage.setItem('mceCurrent',JSON.stringify(currentUser))}

window.onload=function(){
  if(currentUser){
    loginUser(currentUser);
    loadRecentTransactions();
    updateNotifBadge();
  }
}

function loginUser(user){
  currentUser=user;
  userName.innerText=currentUser.name.split(' ')[0].toUpperCase();
  accNo.innerText='Acc: '+currentUser.accNo;
  balance.innerText=formatBalance(currentUser.balance);
  setEmail.innerText=currentUser.email;
  setPhone.innerText=currentUser.phone;
  setAcc.innerText=currentUser.accNo;
  setCurrency.innerText=countries.find(c=>c.currency===currentUser.currency)?.name + ' ' + currentUser.currency;
}

// RECENT TRANSACTIONS
function addTransaction(type, amount){
  if(!currentUser.transactions) currentUser.transactions=[];
  currentUser.transactions.unshift({type, amount, date:new Date().toLocaleString()});
  if(currentUser.transactions.length>5) currentUser.transactions.pop();
  save();
}
function loadRecentTransactions(){
  if(!currentUser.transactions || currentUser.transactions.length===0){
    recentTxn.innerHTML='<p style="text-align:center;color:#888;padding:20px">No transactions yet</p>';return
  }
  recentTxn.innerHTML = currentUser.transactions.map(t=>`
    <div class="txn-item">
      <div><b>${t.type}</b><br><small style="color:#888">${t.date}</small></div>
      <div style="color:${t.amount>0?'var(--green)':'red'};font-weight:700">${t.amount>0?'+':'-'}${formatBalance(Math.abs(t.amount))}</div>
    </div>
  `).join('');
}

// NOTIFICATIONS
function addNotification(msg){
  let notifs = JSON.parse(localStorage.getItem('mceNotifs_'+currentUser.accNo) || '[]');
  notifs.unshift({msg, time:'Just now', read:false});
  localStorage.setItem('mceNotifs_'+currentUser.accNo, JSON.stringify(notifs));
  updateNotifBadge();
}
function loadNotifications(){
  let notifs = JSON.parse(localStorage.getItem('mceNotifs_'+currentUser.accNo) || '[]');
  if(notifs.length===0){notifList.innerHTML='<p style="text-align:center;color:#888;padding:40px">No notifications</p>';return}
  notifList.innerHTML = notifs.map(n=>`<div class="section"><div><b>${n.msg}</b><br><small style="color:#888">${n.time}</small></div></div>`).join('');
  notifs.forEach(n=>n.read=true);
  localStorage.setItem('mceNotifs_'+currentUser.accNo, JSON.stringify(notifs));
  document.getElementById('notifCount').style.display='none';
}
function updateNotifBadge(){
  let notifs = JSON.parse(localStorage.getItem('mceNotifs_'+currentUser.accNo) || '[]');
  const unread = notifs.filter(n=>!n.read).length;
  document.getElementById('notifCount').innerText = unread;
  document.getElementById('notifCount').style.display = unread>0?'block':'none';
}
function openNotifications(){switchPage('notifPage')}

// BANK FUNCTIONS WITH NOTIF + HISTORY
function openDeposit(){modal.style.display='flex';modalBody.innerHTML=`<h2>Add Money</h2><input id="dAmt" class="input" type="number"><button class="btn" onclick="doDeposit()">Add</button>`}
function doDeposit(){
  const amt=parseFloat(dAmt.value);
  currentUser.balance+=amt;
  addTransaction('Deposit', amt);
  addNotification(`${currentUser.currency}${amt} added to your account`);
  save();location.reload()
}

function openTransfer(){modal.style.display='flex';modalBody.innerHTML=`<h2>Transfer</h2><input id="tAcc" class="input" placeholder="Account Number"><input id="tAmt" class="input" type="number" placeholder="Amount"><button class="btn" onclick="doTransfer()">Send</button>`}
function doTransfer(){
  const amt=parseFloat(tAmt.value);
  currentUser.balance-=amt;
  addTransaction('Transfer to '+tAcc.value, -amt);
  addNotification(`${currentUser.currency}${amt} sent to ${tAcc.value}`);
  save();alert('Transfer Sent!');location.reload()
}

function openWithdraw(){modal.style.display='flex';modalBody.innerHTML=`<h2>Withdraw</h2><input id="wAmt" class="input" type="number"><button class="btn" onclick="doWithdraw()">Withdraw</button>`}
function doWithdraw(){
  const amt=parseFloat(wAmt.value);
  currentUser.balance-=amt;
  addTransaction('Withdrawal', -amt);
  addNotification(`${currentUser.currency}${amt} withdrawn`);
  save();location.reload()
}

// ALL OTHER ICONS WORKING
function openAirtime(){modal.style.display='flex';modalBody.innerHTML=`<h2>Buy Airtime</h2><input class="input" placeholder="Phone"><input class="input" type="number" placeholder="Amount"><button class="btn" onclick="alert('Airtime bought');closeModal()">Buy</button>`}
function openData(){modal.style.display='flex';modalBody.innerHTML=`<h2>Buy Data</h2><button class="btn" onclick="alert('1GB bought')">1GB</button>`}
function openBills(){modal.style.display='flex';modalBody.innerHTML=`<h2>Pay Bills</h2><button class="btn" onclick="alert('Bill paid')">Electricity</button>`}
function openTV(){modal.style.display='flex';modalBody.innerHTML=`<h2>TV</h2><button class="btn" onclick="alert('DSTV paid')">DSTV</button>`}
function openSafeBox(){modal.style.display='flex';modalBody.innerHTML=`<h2>SafeBox</h2><p>Earn 5% interest</p>`}
function openLoan(){modal.style.display='flex';modalBody.innerHTML=`<h2>Apply Loan</h2><input id="loanAmt" class="input" type="number"><button class="btn" onclick="doLoan()">Get Loan</button>`}
function doLoan(){currentUser.balance+=parseFloat(loanAmt.value);addTransaction('Loan', parseFloat(loanAmt.value));addNotification(`Loan of ${currentUser.currency}${loanAmt.value} credited`);save();location.reload()}
function openGame(){alert('Game Center')}
function openMore(){alert('More Services')}

// CURRENCY
function openCurrency(){
  modal.style.display='flex';
  modalBody.innerHTML=`<h2>Select Country</h2>` + countries.map(c=>
    `<div class="section" onclick="changeCurrency('${c.currency}')"><div><b>${c.name}</b> ${c.currency}</div></div>`
  ).join('');
}
function changeCurrency(cur){currentUser.currency=cur;save();location.reload()}

// REGISTER - NO WELCOME BONUS, DEFAULT $
function register(){
  const email=regEmail.value.trim().toLowerCase();
  const phone=regPhone.value.trim();
  if(users.find(u=>u.email.toLowerCase()===email)){alert('Email exists');return}
  if(users.find(u=>u.phone===phone)){alert('Phone exists');return}
  const newUser={name:regName.value,email,phone,password:regPass.value,currency:'$',balance:0,accNo:'10'+Math.floor(Math.random()*90000000+10000000),transactions:[]};
  users.push(newUser);save();alert('Account Created with $0.00');location.reload()
}

function logout(){localStorage.removeItem('mceCurrent');location.reload()}
</script>
</body>
</html>
