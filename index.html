<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCE BANK</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #f5f5f5; }
 .screen { display: none; padding: 20px; max-width: 400px; margin: auto; background: white; min-height: 100vh; }
 .active { display: block; }
 .btn { width: 100%; padding: 14px; margin: 10px 0; background: #0047AB; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
 .btn2 { background: white; color: #0047AB; border: 2px solid #0047AB; }
  input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
 .header { background: #0047AB; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
 .balance { font-size: 32px; font-weight: bold; }
 .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
 .card { background: #f0f4ff; padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; }
 .transaction { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; }
 .error { color: red; font-size: 14px; margin: 5px 0; }
 .success { color: green; font-size: 14px; margin: 5px 0; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="screen active">
  <h2 style="text-align:center; margin: 30px 0;">MCE BANK</h2>
  <div id="loginMsg"></div>
  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPassword" placeholder="Password">
  <button class="btn" onclick="login()">Sign In</button>
  <button class="btn btn2" onclick="showScreen('signupScreen')">Create New Account</button>
</div>

<!-- SIGNUP SCREEN -->
<div id="signupScreen" class="screen">
  <h2>Create Account</h2>
  <div id="signupMsg"></div>
  <input type="text" id="signupName" placeholder="Full Name">
  <input type="email" id="signupEmail" placeholder="Email">
  <input type="password" id="signupPassword" placeholder="Password">
  <input type="text" id="signupPhone" placeholder="Phone Number">
  <select id="signupFinancial" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px;">
    <option>Financial Situation</option>
    <option>Employed</option>
    <option>Self Employed</option>
    <option>Student</option>
  </select>
  <button class="btn" onclick="signup()">Create Account</button>
  <button class="btn btn2" onclick="showScreen('loginScreen')">Back to Login</button>
</div>

<!-- DASHBOARD SCREEN -->
<div id="dashboardScreen" class="screen">
  <div class="header">
    <div style="display:flex; justify-content:space-between;">
      <div>
        <div>Welcome,</div>
        <div id="userName" style="font-size:18px; font-weight:bold;"></div>
      </div>
      <button onclick="logout()" style="background:red; color:white; border:none; padding:8px 12px; border-radius:6px;">Logout</button>
    </div>
    <div style="margin-top:15px;">Available Balance</div>
    <div class="balance" id="userBalance">$0.00</div>
  </div>

  <div class="grid">
    <div class="card" onclick="showScreen('depositScreen')">💰<br>Deposit</div>
    <div class="card" onclick="showScreen('transferScreen')">📤<br>Transfer</div>
    <div class="card" onclick="showScreen('paybillsScreen')">🧾<br>Pay Bills</div>
    <div class="card" onclick="alert('Coming Soon')">⚙️<br>Settings</div>
  </div>

  <h3>Recent Transactions</h3>
  <div id="transactionsList"></div>
</div>

<!-- DEPOSIT SCREEN -->
<div id="depositScreen" class="screen">
  <h2>Deposit Money</h2>
  <input type="number" id="depositAmount" placeholder="Amount">
  <button class="btn" onclick="deposit()">Deposit</button>
  <button class="btn btn2" onclick="showScreen('dashboardScreen')">Back</button>
</div>

<!-- TRANSFER SCREEN -->
<div id="transferScreen" class="screen">
  <h2>Transfer Money</h2>
  <input type="text" id="transferAccount" placeholder="Recipient Account">
  <input type="number" id="transferAmount" placeholder="Amount">
  <button class="btn" onclick="transfer()">Send Money</button>
  <button class="btn btn2" onclick="showScreen('dashboardScreen')">Back</button>
</div>

<!-- PAY BILLS SCREEN -->
<div id="paybillsScreen" class="screen">
  <h2>Pay Bills</h2>
  <input type="text" id="billType" placeholder="Bill Type: Electric, Water">
  <input type="number" id="billAmount" placeholder="Amount">
  <button class="btn" onclick="paybill()">Pay Bill</button>
  <button class="btn btn2" onclick="showScreen('dashboardScreen')">Back</button>
</div>

<script>
let currentUser = null;

// LOAD USERS FROM STORAGE
function getUsers() {
  return JSON.parse(localStorage.getItem('mceUsers')) || [];
}
function saveUsers(users) {
  localStorage.setItem('mceUsers', JSON.stringify(users));
}

// SHOW SCREEN
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// SIGN UP - BLOCK DUPLICATE EMAIL
function signup() {
  const name = document.getElementById('signupName').value;
  const email = document.getElementById('signupEmail').value.toLowerCase();
  const password = document.getElementById('signupPassword').value;
  const phone = document.getElementById('signupPhone').value;
  const financial = document.getElementById('signupFinancial').value;
  const msg = document.getElementById('signupMsg');

  let users = getUsers();
  
  // CHECK IF EMAIL ALREADY EXISTS
  const existing = users.find(u => u.email === email);
  if(existing) {
    msg.innerHTML = '<div class="error">This email already have account. Please Login</div>';
    return;
  }

  // CREATE NEW USER
  const newUser = {
    name, email, password, phone, financial,
    balance: 0,
    transactions: []
  };
  users.push(newUser);
  saveUsers(users);
  
  msg.innerHTML = '<div class="success">Account Created! Please Login</div>';
  setTimeout(() => showScreen('loginScreen'), 1500);
}

// LOGIN
function login() {
  const email = document.getElementById('loginEmail').value.toLowerCase();
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');
  
  let users = getUsers();
  const user = users.find(u => u.email === email && u.password === password);
  
  if(user) {
    currentUser = user;
    loadDashboard();
    showScreen('dashboardScreen');
  } else {
    msg.innerHTML = '<div class="error">Invalid Email or Password</div>';
  }
}

// LOAD DASHBOARD
function loadDashboard() {
  document.getElementById('userName').innerText = currentUser.name;
  document.getElementById('userBalance').innerText = '$' + currentUser.balance.toFixed(2);
  
  let html = '';
  currentUser.transactions.slice(-5).reverse().forEach(t => {
    html += `<div class="transaction"><span>${t.type}</span><span style="color:${t.amount<0?'red':'green'}">${t.amount<0?'-':'+'}$${Math.abs(t.amount)}</span></div>`;
  });
  document.getElementById('transactionsList').innerHTML = html || '<div>No transactions yet</div>';
}

// UPDATE USER IN STORAGE
function updateUser() {
  let users = getUsers();
  let index = users.findIndex(u => u.email === currentUser.email);
  users[index] = currentUser;
  saveUsers(users);
}

// DEPOSIT
function deposit() {
  const amount = parseFloat(document.getElementById('depositAmount').value);
  if(amount > 0) {
    currentUser.balance += amount;
    currentUser.transactions.push({type: 'Deposit', amount: amount, date: new Date()});
    updateUser();
    loadDashboard();
    showScreen('dashboardScreen');
    alert('Deposit Successful');
  }
}

// TRANSFER
function transfer() {
  const amount = parseFloat(document.getElementById('transferAmount').value);
  const account = document.getElementById('transferAccount').value;
  if(amount > 0 && amount <= currentUser.balance) {
    currentUser.balance -= amount;
    currentUser.transactions.push({type: 'Transfer to ' + account, amount: -amount, date: new Date()});
    updateUser();
    loadDashboard();
    showScreen('dashboardScreen');
    alert('Transfer Successful');
  } else {
    alert('Insufficient Balance');
  }
}

// PAY BILL
function paybill() {
  const amount = parseFloat(document.getElementById('billAmount').value);
  const bill = document.getElementById('billType').value;
  if(amount > 0 && amount <= currentUser.balance) {
    currentUser.balance -= amount;
    currentUser.transactions.push({type: 'Pay Bill: ' + bill, amount: -amount, date: new Date()});
    updateUser();
    loadDashboard();
    showScreen('dashboardScreen');
    alert('Bill Paid Successfully');
  } else {
    alert('Insufficient Balance');
  }
}

// LOGOUT
function logout() {
  currentUser = null;
  showScreen('loginScreen');
}
</script>
</body>
    </html>
