<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>MCE BANK - Dashboard</title>
<style>
  body { font-family: Arial; background: #f5f5f5; padding: 20px; text-align: center; }
  .card { background: white; padding: 20px; border-radius: 10px; margin: 10px auto; max-width: 400px; }
  .balance { font-size: 28px; color: #007bff; font-weight: bold; }
  button { padding: 12px 20px; margin: 5px; border: none; border-radius: 8px; background: #007bff; color: white; }
</style>
</head>
<body>
  <h1>🏦 MCE BANK</h1>
  <div class="card">
    <p>Available Balance</p>
    <p class="balance">$0.00 USD</p>
  </div>
  <div class="card">
    <h3>Account Details</h3>
    <p><b>Name:</b> Loading...</p>
    <p><b>Account Number:</b> Loading...</p>
  </div>
  <div>
    <button>Send</button>
    <button>Receive</button>
    <button>Deposit</button>
    <button>Withdraw</button>
  </div>
  <br>
  <button style="background:red;">Logout</button>
</body>
</html>
