<!DOCTYPE html>
<html>
<head>
    <title>MCE BANK - Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: Arial;}
        body {background: #f5f7fa; padding-bottom: 80px;}
        .demo {color: red; font-weight: bold; text-align: center; padding: 8px; background: white; font-size: 12px;}
        .header {display: flex; justify-content: space-between; align-items: center; padding: 20px 16px; background: white;}
        .welcome {display: flex; align-items: center; gap: 12px;}
        .welcome img {width: 48px; height: 48px; border-radius: 50%; background: #ddd; border: 2px solid #0a90f0;}
        .welcome h3 {font-size: 16px; color: #111; font-weight: 700;}
        .welcome p {font-size: 14px; color: #555;}
        .balance-card {background: #0a90f0; color: white; margin: 16px; padding: 20px; border-radius: 16px;}
        .balance-amount {font-size: 30px; font-weight: 700; margin-bottom: 18px;}
        .actions {display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 0 16px 16px 16px;}
        .action-btn {text-align: center; cursor: pointer;}
        .action-btn .icon {width: 100%; aspect-ratio: 1; background: white; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 8px; color: #0a90f0;}
        .action-btn p {font-size: 12px; color: #333; font-weight: 500;}
        .logout-btn {background: red; color: white; padding: 14px; width: calc(100% - 32px); margin: 20px 16px; border: none; border-radius: 10px; font-weight: bold; font-size: 16px;}
    </style>
</head>
<body>
    <p class="demo">DEMO ONLY - NOT A REAL BANK</p>
    <div class="header">
        <div class="welcome">
            <img id="userAvatar" src="">
            <div>
                <h3>Welcome back</h3>
                <p id="userName">Loading...</p>
            </div>
        </div>
    </div>
    <div class="balance-card">
        <div class="balance-amount" id="balance">$0.00 USD</div>
        <p>Account: <span id="accNumber"></span></p>
    </div>
    <div class="actions">
        <div class="action-btn" onclick="alert('Admin Only')"><div class="icon">⇄</div><p>Transfer</p></div>
        <div class="action-btn" onclick="alert('Demo')"><div class="icon">↓</div><p>Deposit</p></div>
        <div class="action-btn" onclick="alert('Demo')"><div class="icon">✈</div><p>Pay</p></div>
        <div class="action-btn" onclick="alert('Demo')"><div class="icon">💬</div><p>Message</p></div>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
    <script>
        const currentEmail = localStorage.getItem('mceCurrentUser');
        if(!currentEmail) { window.location.href = "index.html"; }
        const userData = JSON.parse(localStorage.getItem('mceUser_' + currentEmail));
        document.getElementById('userName').innerText = userData.name;
        document.getElementById('accNumber').innerText = userData.accountNumber;
        document.getElementById('balance').innerText = "$" + userData.balance.toFixed(2) + " USD";
        document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${userData.name}&background=0a90f0&color=fff`;
        function logout() { localStorage.removeItem('mceCurrentUser'); window.location.href = "index.html"; }
    </script>
</body>
                                                            </html>
